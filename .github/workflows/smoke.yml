name: smoke

on:
  push:
  pull_request:

jobs:
  test:
    # The tool only targets Windows, so the test must run there too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check dsh-migrate.mjs
      - name: Smoke test
        run: node test/smoke.mjs 2>&1 | Tee-Object -FilePath smoke.log
      # 失败时把日志尾部提升为 annotation，这样在无法下载原始日志的环境里也能看到原因。
      - name: Report failure
        if: failure()
        run: |
          node --version
          if (Test-Path smoke.log) {
            Get-Content smoke.log -Tail 40 | ForEach-Object { "::error::$_" }
          } else {
            "::error::smoke.log was not produced"
          }
