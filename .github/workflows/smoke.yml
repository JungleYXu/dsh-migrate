name: smoke

on:
  push:
  pull_request:

jobs:
  test:
    # The tool only targets Windows, so the test must run there too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check dsh-migrate.mjs
      - name: Smoke test
        run: node test/smoke.mjs 2>&1 | Tee-Object -FilePath smoke.log
      # 失败时把日志尾部提升为一条 annotation（GitHub 每步最多显示 10 条，所以必须合并成一条），
      # 这样在无法下载原始日志的环境里也能看到原因。
      - name: Report failure
        if: failure()
        run: |
          node --version
          if (Test-Path smoke.log) {
            $fails = (Select-String -Path smoke.log -Pattern 'FAIL') | ForEach-Object { $_.Line }
            if ($fails) {
              $joined = ($fails -join ' | ').Replace('%', '%25').Replace("`r", ' ')
              "::error::SMOKE FAILS: $joined"
            }
            $tail = (Get-Content smoke.log -Tail 45) -join ' | '
            $tail = $tail.Replace('%', '%25').Replace("`r", '').Replace("`n", ' ')
            "::error::SMOKE TAIL: $tail"
          } else {
            "::error::smoke.log was not produced"
          }
